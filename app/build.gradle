plugins { id 'com.android.application' }
android {
    namespace 'com.meteorsss.startrace'
    compileSdk 36
    defaultConfig {
        applicationId 'com.meteorsss.startrace'
        minSdk 31
        targetSdk 36
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('SIGNING_STORE_FILE') ?: 'not-configured.p12')
            storePassword System.getenv('SIGNING_PASSWORD') ?: ''
            keyAlias 'startrace'
            keyPassword System.getenv('SIGNING_PASSWORD') ?: ''
            storeType 'PKCS12'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}